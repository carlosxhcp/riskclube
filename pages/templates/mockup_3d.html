{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mockup 3D</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
        }

        .mockup-page {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        .mockup-header {
            padding: 12px;
            background: #000;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            align-items: center;
            flex: 0 0 auto;
        }

        .mockup-header input,
        .mockup-header button,
        .file-label {
            width: 100%;
            min-height: 42px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .mockup-header input {
            grid-column: 1 / -1;
            background: #fff;
            color: #000;
            padding: 10px;
        }

        .mockup-header button {
            background: #fff;
            color: #000;
            padding: 10px 8px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .mockup-header button:active {
            transform: scale(0.98);
            opacity: 0.85;
        }

        #viewer {
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
        }

        #viewer canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }

        .loading-message {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            text-align: center;
            color: #ddd;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .mockup-header {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                padding: 10px;
                gap: 7px;
            }

            .mockup-header input,
            .mockup-header button {
                min-height: 40px;
                font-size: 12px;
                padding: 8px 6px;
            }
        }
    </style>
</head>

<body>

    <div class="mockup-page">
        <div class="mockup-header">
            <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp">

            <button type="button" id="increaseLogo">Aumentar</button>
            <button type="button" id="decreaseLogo">Diminuir</button>
            <button type="button" id="moveUp">Subir</button>
            <button type="button" id="moveDown">Descer</button>
            <button type="button" id="moveLeft">Esquerda</button>
            <button type="button" id="moveRight">Direita</button>
            <button type="button" id="resetLogo">Resetar</button>
            <button type="button" id="saveMockup">Salvar</button>
        </div>

        <div id="viewer">
            <div class="loading-message" id="loadingMessage">Carregando mockup...</div>
        </div>
    </div>

    <script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

    <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
        import { OrbitControls } from "three/addons/controls/OrbitControls.js";
        import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

        const container = document.getElementById("viewer");
        const loadingMessage = document.getElementById("loadingMessage");
        const isMobile = window.matchMedia("(max-width: 768px), (pointer: coarse)").matches;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(
            25,
            Math.max(container.clientWidth, 1) / Math.max(container.clientHeight, 1),
            0.1,
            100
        );
        camera.position.set(-70, 30, 50);

        const renderer = new THREE.WebGLRenderer({
            antialias: !isMobile,
            preserveDrawingBuffer: true,
            powerPreference: "high-performance",
            alpha: false
        });

        renderer.setSize(container.clientWidth, container.clientHeight, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.25 : 1.75));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = !isMobile;
        controls.dampingFactor = 0.06;
        controls.enablePan = false;
        controls.enableZoom = true;
        controls.rotateSpeed = isMobile ? 0.55 : 0.8;
        controls.zoomSpeed = 0.7;
        controls.target.set(0, 1.2, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));

        const frontLight = new THREE.DirectionalLight(0xffffff, 1.8);
        frontLight.position.set(2, 4, 5);
        scene.add(frontLight);

        const sideLight = new THREE.DirectionalLight(0xffffff, 2.2);
        sideLight.position.set(-4, 3, 2);
        scene.add(sideLight);

        let bottleModel = null;
        let printArea = null;
        let originalPrintAreaPosition = null;
        let originalPrintAreaScale = null;
        let originalPrintAreaRotation = null;
        let currentLogoTexture = null;
        let needsRender = true;
        let lastFrameTime = 0;
        const targetFPS = isMobile ? 30 : 60;
        const frameInterval = 1000 / targetFPS;

        function requestRender() {
            needsRender = true;
        }

        function disposeMaterial(material) {
            if (!material) return;
            const materials = Array.isArray(material) ? material : [material];
            materials.forEach((mat) => {
                if (mat.map) mat.map.dispose();
                mat.dispose();
            });
        }

        function resizeRenderer() {
            const width = Math.max(container.clientWidth, 1);
            const height = Math.max(container.clientHeight, 1);

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height, false);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isMobile ? 1.25 : 1.75));
            requestRender();
        }

        function fitCameraToModel(object) {
            const box = new THREE.Box3().setFromObject(object);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxSize = Math.max(size.x, size.y, size.z);
            const distance = maxSize / (2 * Math.tan((camera.fov * Math.PI) / 360));

            camera.position.set(center.x - distance * 1.35, center.y + distance * 0.55, center.z + distance);
            camera.near = Math.max(distance / 100, 0.1);
            camera.far = distance * 100;
            camera.updateProjectionMatrix();

            controls.target.copy(center);
            controls.update();
        }

        function createResizedTexture(file, callback) {
            const imageUrl = URL.createObjectURL(file);
            const image = new Image();
            image.onload = function () {
                const maxSize = isMobile ? 1024 : 1536;
                const scale = Math.min(1, maxSize / Math.max(image.width, image.height));
                const width = Math.max(1, Math.round(image.width * scale));
                const height = Math.max(1, Math.round(image.height * scale));

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d", { alpha: true });
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = "high";
                ctx.drawImage(image, 0, 0, width, height);

                const texture = new THREE.CanvasTexture(canvas);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.flipY = false;
                texture.wrapS = THREE.ClampToEdgeWrapping;
                texture.wrapT = THREE.ClampToEdgeWrapping;
                texture.generateMipmaps = false;
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;

                URL.revokeObjectURL(imageUrl);
                callback(texture);
            };

            image.onerror = function () {
                URL.revokeObjectURL(imageUrl);
                alert("Não foi possível carregar essa imagem.");
            };

            image.src = imageUrl;
        }

        const loader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/");
        loader.setDRACOLoader(dracoLoader);

        loader.load(
            "{% static 'models/garrafa.glb' %}",
            function (gltf) {
                bottleModel = gltf.scene;
                bottleModel.position.set(0, 0, 0);
                bottleModel.rotation.y = -3;
                bottleModel.rotation.x = -0.1;
                bottleModel.scale.set(1.5, 1.5, 1.5);
                scene.add(bottleModel);

                const bottleMaterial = new THREE.MeshStandardMaterial({
                    color: "#d8d8d8",
                    roughness: 0.72,
                    metalness: 0.05
                });

                bottleModel.traverse((child) => {
                    if (child.isMesh && child.name !== "print_area") {
                        disposeMaterial(child.material);
                        child.material = bottleMaterial;
                        child.frustumCulled = true;
                        child.castShadow = false;
                        child.receiveShadow = false;
                    }
                });

                printArea = bottleModel.getObjectByName("print_area");

                if (!printArea) {
                    loadingMessage.textContent = "Objeto print_area não encontrado no GLB.";
                    alert("Objeto print_area não encontrado no GLB. Confira se o nome no Blender está exatamente: print_area");
                    return;
                }

                originalPrintAreaPosition = printArea.position.clone();
                originalPrintAreaScale = printArea.scale.clone();
                originalPrintAreaRotation = printArea.rotation.clone();

                disposeMaterial(printArea.material);
                printArea.material = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.15,
                    roughness: 0.5,
                    metalness: 0,
                    side: THREE.DoubleSide
                });

                fitCameraToModel(bottleModel);
                loadingMessage.style.display = "none";
                requestRender();
            },
            undefined,
            function (error) {
                console.error("Erro ao carregar modelo:", error);
                loadingMessage.textContent = "Erro ao carregar o modelo 3D.";
                alert("Erro ao carregar o modelo 3D. Confira o caminho static/models/garrafa.glb");
            }
        );

        document.getElementById("imageUpload").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!printArea) {
                alert("A área de impressão ainda não foi carregada.");
                return;
            }

            createResizedTexture(file, function (texture) {
                if (currentLogoTexture) currentLogoTexture.dispose();
                currentLogoTexture = texture;

                disposeMaterial(printArea.material);
                printArea.material = new THREE.MeshStandardMaterial({
                    map: texture,
                    transparent: true,
                    roughness: 0.45,
                    metalness: 0,
                    side: THREE.DoubleSide
                });

                requestRender();
            });
        });

        function changeLogo(callback) {
            if (!printArea) return;
            callback();
            requestRender();
        }

        document.getElementById("increaseLogo").addEventListener("click", function () {
            changeLogo(() => printArea.scale.multiplyScalar(1.1));
        });

        document.getElementById("decreaseLogo").addEventListener("click", function () {
            changeLogo(() => printArea.scale.multiplyScalar(0.9));
        });

        document.getElementById("moveUp").addEventListener("click", function () {
            changeLogo(() => printArea.position.y += 0.02);
        });

        document.getElementById("moveDown").addEventListener("click", function () {
            changeLogo(() => printArea.position.y -= 0.02);
        });

        document.getElementById("moveLeft").addEventListener("click", function () {
            changeLogo(() => printArea.position.x -= 0.02);
        });

        document.getElementById("moveRight").addEventListener("click", function () {
            changeLogo(() => printArea.position.x += 0.02);
        });

        document.getElementById("resetLogo").addEventListener("click", function () {
            if (!printArea || !originalPrintAreaPosition || !originalPrintAreaScale || !originalPrintAreaRotation) return;

            printArea.position.copy(originalPrintAreaPosition);
            printArea.scale.copy(originalPrintAreaScale);
            printArea.rotation.copy(originalPrintAreaRotation);
            requestRender();
        });

        document.getElementById("saveMockup").addEventListener("click", function () {
            renderer.render(scene, camera);
            const image = renderer.domElement.toDataURL("image/png");
            const link = document.createElement("a");
            link.href = image;
            link.download = "mockup-garrafa.png";
            link.click();
        });

        controls.addEventListener("change", requestRender);

        function animate(time) {
            requestAnimationFrame(animate);

            if (time - lastFrameTime < frameInterval) return;
            lastFrameTime = time;

            const controlsChanged = controls.enableDamping ? controls.update() : false;

            if (needsRender || controlsChanged) {
                renderer.render(scene, camera);
                needsRender = false;
            }
        }

        requestAnimationFrame(animate);

        let resizeTimer = null;
        window.addEventListener("resize", function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(resizeRenderer, 120);
        }, { passive: true });

        window.addEventListener("orientationchange", function () {
            setTimeout(resizeRenderer, 250);
        }, { passive: true });
    </script>

</body>

</html>
