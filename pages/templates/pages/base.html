{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Risk Clube{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=10">

    <style>
        @media (max-width: 768px) {
            .main-navbar {
                height: 64px !important;
                min-height: 64px !important;
                padding: 0 10px !important;
                display: grid !important;
                grid-template-columns: 40px minmax(0, 1fr) 86px !important;
                align-items: center !important;
                overflow: visible !important;
            }

            .mobile-menu-btn {
                display: flex !important;
                grid-column: 1 !important;
                width: 40px !important;
                height: 40px !important;
                align-items: center !important;
                justify-content: flex-start !important;
                font-size: 26px !important;
            }

            .nav-left {
                display: none !important;
            }

            .nav-center {
                grid-column: 2 !important;
                width: 100% !important;
                min-width: 0 !important;
                display: flex !important;
                justify-content: center !important;
                overflow: hidden !important;
            }

            .logo img {
                max-width: 105px !important;
                max-height: 62px !important;
            }

            .nav-right {
                grid-column: 3 !important;
                width: 86px !important;
                min-width: 86px !important;
                display: flex !important;
                justify-content: flex-end !important;
                align-items: center !important;
                gap: 12px !important;
                overflow: visible !important;
            }

            .search-form,
            .favorite-icon {
                display: none !important;
            }

            .account-icon,
            .cart-open-btn {
                display: flex !important;
                width: 28px !important;
                min-width: 28px !important;
                height: 28px !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 20px !important;
                padding: 0 !important;
                margin: 0 !important;
                color: #000 !important;
            }
        }

        .cart-qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .cart-qty-controls button {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: #fff;
            color: #111;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .2s ease;
        }

        .cart-qty-controls button:hover {
            border-color: #111;
        }

        .cart-qty-controls span {
            min-width: 18px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #111;
        }

        .mini-shipping-box {
            margin: 14px 0 16px;
            padding: 14px 0;
            border-top: 1px solid #e5e5e5;
            border-bottom: 1px solid #e5e5e5;
        }

        .mini-shipping-title {
            font-size: 12px;
            font-weight: 600;
            color: #111;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .mini-shipping-form {
            display: flex;
            gap: 8px;
        }

        .mini-shipping-form input {
            width: 100%;
            height: 38px;
            border: 1px solid #ddd;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
            color: #111;
        }

        .mini-shipping-form input:focus {
            border-color: #111;
        }

        .mini-shipping-form button {
            min-width: 90px;
            height: 38px;
            border: 1px solid #111;
            background: #111;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }

        .mini-shipping-form button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .mini-shipping-message {
            margin-top: 8px;
            font-size: 12px;
            color: #555;
        }

        .mini-shipping-message.error {
            color: #b00020;
        }

        .mini-shipping-options {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mini-shipping-option {
            width: 100%;
            border: 1px solid #ddd;
            background: #fff;
            color: #111;
            padding: 10px;
            cursor: pointer;
            text-align: left;
            transition: .2s ease;
        }

        .mini-shipping-option:hover,
        .mini-shipping-option.selected {
            border-color: #111;
        }

        .mini-shipping-option-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .mini-shipping-option-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .mini-shipping-icon {
            width: 38px;
            max-height: 26px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .mini-shipping-option-sub {
            margin-top: 3px;
            font-size: 11px;
            color: #666;
        }

        .mini-change-shipping {
            margin-top: 8px;
            border: 0;
            background: transparent;
            color: #111;
            padding: 0;
            font-size: 12px;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="top-bar">
        FRETE GRÁTIS EM PEDIDOS ACIMA DE R$250
    </div>

    <nav class="main-navbar">

        <button class="mobile-menu-btn" id="mobileMenuBtn" type="button">
            <i class="bi bi-list"></i>
        </button>

        <div class="nav-left">
            <a href="/" class="nav-link-custom">INICIO</a>
            <a href="/#products" class="nav-link-custom">SHOP</a>
            <a href="/about/" class="nav-link-custom">COMUNIDADE</a>
        </div>

        <div class="nav-center">
            <a href="/" class="logo">
                <img style="width: 40%;" src="{% static 'img/logo-black.png' %}" alt="Risk Clube">
            </a>
        </div>

        <div class="nav-right">

            <a href="#" class="icon-link account-icon">
                <i class="bi bi-person"></i>
            </a>

            <a href="#" class="icon-link favorite-icon">
                <i class="bi bi-heart"></i>
            </a>

            <button type="button" class="icon-link cart-open-btn" id="openCartBtn">
                <i class="bi bi-bag"></i>
            </button>
        </div>

    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <button class="close-mobile-menu" id="closeMobileMenu" type="button">
            <i class="bi bi-x-lg"></i>
        </button>

        <a href="/" class="mobile-link">INICIO</a>
        <a href="/#products" class="mobile-link">SHOP</a>
        <a href="/about/" class="mobile-link">COMUNIDADE</a>
    </div>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    {% block content %}{% endblock %}

    <div class="cart-overlay" id="cartOverlay"></div>

    <aside class="side-cart" id="sideCart">

        <div class="side-cart-header">
            <h3>Seu Carrinho</h3>
            <button type="button" id="closeCartBtn">× Fechar</button>
        </div>

        <div class="free-shipping-box">
            <p id="freeShippingText">
                Adicione mais R$ 250 para Frete Grátis
            </p>

            <div class="free-shipping-bar">
                <div class="free-shipping-progress" id="freeShippingProgress"></div>
            </div>
        </div>

        <div id="sideCartContent" class="side-cart-content">
            <div class="empty-cart-box">
                <i class="bi bi-cart-fill"></i>
                <p>Não há itens no carrinho</p>
            </div>
        </div>

        <div class="side-cart-footer" id="sideCartFooter"></div>

    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const openCartBtn = document.getElementById("openCartBtn");
        const closeCartBtn = document.getElementById("closeCartBtn");
        const sideCart = document.getElementById("sideCart");
        const cartOverlay = document.getElementById("cartOverlay");
        const sideCartContent = document.getElementById("sideCartContent");
        const sideCartFooter = document.getElementById("sideCartFooter");
        const freeShippingText = document.getElementById("freeShippingText");
        const freeShippingProgress = document.getElementById("freeShippingProgress");

        let shippingOptions = [];

        function formatMoney(value) {
            return "R$ " + Number(value || 0).toFixed(2).replace(".", ",");
        }

        function getShippingPrice(data) {
            if (!data) return 0;

            if (data.shipping_price !== undefined && data.shipping_price !== null) {
                return Number(data.shipping_price || 0);
            }

            if (data.shipping && data.shipping.price !== undefined) {
                return Number(data.shipping.price || 0);
            }

            return 0;
        }

        function openCart() {
            sideCart.classList.add("active");
            cartOverlay.classList.add("active");
            loadCart();
        }

        function closeCart() {
            sideCart.classList.remove("active");
            cartOverlay.classList.remove("active");
        }

        async function loadCart() {
            const response = await fetch("/cart/data/");
            const data = await response.json();

            freeShippingProgress.style.width = data.free_shipping_progress + "%";

            if (data.free_shipping_remaining > 0) {
                freeShippingText.innerText =
                    `Adicione mais ${formatMoney(data.free_shipping_remaining)} para Frete Grátis`;
            } else {
                freeShippingText.innerText = "Você ganhou Frete Grátis";
            }

            if (data.items.length === 0) {
                sideCartContent.innerHTML = `
                    <div class="empty-cart-box">
                        <i class="bi bi-cart-fill"></i>
                        <p>Não há itens no carrinho</p>
                    </div>
                `;

                sideCartFooter.innerHTML = "";
                return;
            }

            sideCartContent.innerHTML = data.items.map(item => `
                <div class="cart-item">

                    <img src="${item.image}" alt="${item.name}">

                    <div class="cart-item-info">

                        <div class="cart-item-name">
                            ${item.name}
                        </div>

                        <div class="cart-item-size">
                            Cor: ${item.color || "-"}
                        </div>

                        <div class="cart-item-size">
                            Tamanho: ${item.size || "-"}
                        </div>

                        <div class="cart-item-installments">
                            ${item.installments}
                        </div>

                        <div class="cart-qty-controls">
                            <button type="button" onclick="updateCartQty('${item.cart_key}', -1)">−</button>
                            <span>${item.quantity}</span>
                            <button type="button" onclick="updateCartQty('${item.cart_key}', 1)">+</button>
                        </div>

                    </div>

                    <div class="cart-item-price">
                        ${formatMoney(item.subtotal)}
                    </div>

                </div>
            `).join("");

            renderCartFooter(data);
        }

        function renderCartFooter(data) {
            const shippingPrice = getShippingPrice(data);
            const shipping = data.shipping;

            sideCartFooter.innerHTML = `
                <div class="mini-shipping-box">
                    <div class="mini-shipping-title">Calcular frete</div>

                    <div id="miniShippingSelected">
                        ${shipping ? `
                            <div class="mini-shipping-option selected">
                                <div class="mini-shipping-option-main">
                                    <div class="mini-shipping-option-left">
                                        ${shipping.icon ? `
                                            <img
                                                src="${shipping.icon}"
                                                alt="${shipping.company || shipping.name}"
                                                class="mini-shipping-icon"
                                            >
                                        ` : ""}

                                        <div>
                                            <div>${shipping.name || "Frete"}</div>

                                            <div class="mini-shipping-option-sub">
                                                ${shipping.company ? shipping.company + " • " : ""}
                                                ${shipping.time ? shipping.time + " dias úteis" : ""}
                                                ${shipping.cep ? "CEP: " + shipping.cep : ""}
                                            </div>
                                        </div>
                                    </div>

                                    <strong>${shippingPrice > 0 ? formatMoney(shippingPrice) : "Grátis"}</strong>
                                </div>
                            </div>

                            <button type="button" class="mini-change-shipping" onclick="showShippingForm()">
                                Trocar frete
                            </button>
                        ` : ""}
                    </div>

                    <div id="miniShippingFormBox" style="${shipping ? "display:none;" : ""}">
                        <div class="mini-shipping-form">
                            <input
                                type="text"
                                id="miniShippingCep"
                                placeholder="Digite seu CEP"
                                maxlength="9"
                                inputmode="numeric"
                            >

                            <button type="button" id="miniShippingBtn" onclick="calculateMiniShipping()">
                                Calcular
                            </button>
                        </div>

                        <div class="mini-shipping-message" id="miniShippingMessage"></div>
                        <div class="mini-shipping-options" id="miniShippingOptions"></div>
                    </div>
                </div>

                <div class="cart-total-line">
                    <span>Subtotal</span>
                    <strong>${formatMoney(data.subtotal)}</strong>
                </div>

                <div class="cart-total-line">
                    <span>Frete</span>
                    <strong>${shipping ? (shippingPrice > 0 ? formatMoney(shippingPrice) : "Grátis") : "Calcule"}</strong>
                </div>

                <div class="cart-total-line">
                    <span>Total</span>
                    <strong>${formatMoney(data.total)}</strong>
                </div>

                <a href="/cart/infinitepay/checkout/" class="checkout-btn">
                    FINALIZAR COMPRA
                </a>
            `;

            const cepInput = document.getElementById("miniShippingCep");

            if (cepInput) {
                cepInput.addEventListener("input", function () {
                    let value = this.value.replace(/\D/g, "").slice(0, 8);

                    if (value.length > 5) {
                        value = value.replace(/^(\d{5})(\d{1,3})$/, "$1-$2");
                    }

                    this.value = value;
                });
            }
        }

        function showShippingForm() {
            const selectedBox = document.getElementById("miniShippingSelected");
            const formBox = document.getElementById("miniShippingFormBox");

            if (selectedBox) {
                selectedBox.innerHTML = "";
            }

            if (formBox) {
                formBox.style.display = "block";
            }
        }

        async function calculateMiniShipping() {
            const cepInput = document.getElementById("miniShippingCep");
            const messageBox = document.getElementById("miniShippingMessage");
            const optionsBox = document.getElementById("miniShippingOptions");
            const button = document.getElementById("miniShippingBtn");

            const cep = cepInput.value.replace(/\D/g, "");

            messageBox.classList.remove("error");
            messageBox.innerText = "";
            optionsBox.innerHTML = "";

            if (cep.length !== 8) {
                messageBox.classList.add("error");
                messageBox.innerText = "Digite um CEP válido.";
                return;
            }

            button.disabled = true;
            button.innerText = "Calculando";

            try {
                const response = await fetch("/cart/calculate-shipping/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": "{{ csrf_token }}"
                    },
                    body: JSON.stringify({
                        cep: cep
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    messageBox.classList.add("error");
                    messageBox.innerText = data.error || "Erro ao calcular frete.";
                    return;
                }

                shippingOptions = data.options || [];

                if (shippingOptions.length === 0) {
                    messageBox.classList.add("error");
                    messageBox.innerText = "Nenhuma opção de frete disponível.";
                    return;
                }

                messageBox.innerText = "Escolha uma opção de frete:";

                optionsBox.innerHTML = shippingOptions.map((option, index) => `
                    <button
                        type="button"
                        class="mini-shipping-option"
                        onclick="selectMiniShipping(${index})"
                    >
                        <div class="mini-shipping-option-main">
                            <div class="mini-shipping-option-left">
                                ${option.icon ? `
                                    <img
                                        src="${option.icon}"
                                        alt="${option.company || option.name}"
                                        class="mini-shipping-icon"
                                    >
                                ` : ""}

                                <div>
                                    <div>${option.name || "Frete"}</div>

                                    <div class="mini-shipping-option-sub">
                                        ${option.company ? option.company + " • " : ""}
                                        ${option.delivery_time ? option.delivery_time + " dias úteis" : ""}
                                    </div>
                                </div>
                            </div>

                            <strong>
                                ${Number(option.price || 0) > 0 ? formatMoney(option.price) : "Grátis"}
                            </strong>
                        </div>
                    </button>
                `).join("");

            } catch (error) {
                messageBox.classList.add("error");
                messageBox.innerText = "Erro ao conectar para calcular o frete.";
            } finally {
                button.disabled = false;
                button.innerText = "Calcular";
            }
        }

        async function selectMiniShipping(index) {
            const option = shippingOptions[index];

            if (!option) {
                return;
            }

            await fetch("/cart/select-shipping/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify(option)
            });

            await loadCart();
        }

        async function updateCartQty(cartKey, change) {
            await fetch("/cart/update/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    cart_key: cartKey,
                    change: change
                })
            });

            loadCart();
        }

        if (openCartBtn) {
            openCartBtn.addEventListener("click", openCart);
        }

        if (closeCartBtn) {
            closeCartBtn.addEventListener("click", closeCart);
        }

        if (cartOverlay) {
            cartOverlay.addEventListener("click", closeCart);
        }
    </script>

</body>

</html>
