{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Risk Clube{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=8">

    <style>
        @media (max-width: 768px) {
            .main-navbar {
                height: 64px !important;
                min-height: 64px !important;
                padding: 0 10px !important;
                display: grid !important;
                grid-template-columns: 40px minmax(0, 1fr) 86px !important;
                align-items: center !important;
                overflow: visible !important;
            }

            .mobile-menu-btn {
                display: flex !important;
                grid-column: 1 !important;
                width: 40px !important;
                height: 40px !important;
                align-items: center !important;
                justify-content: flex-start !important;
                font-size: 26px !important;
            }

            .nav-left {
                display: none !important;
            }

            .nav-center {
                grid-column: 2 !important;
                width: 100% !important;
                min-width: 0 !important;
                display: flex !important;
                justify-content: center !important;
                overflow: hidden !important;
            }

            .logo img {
                max-width: 105px !important;
                max-height: 62px !important;
            }

            .nav-right {
                grid-column: 3 !important;
                width: 86px !important;
                min-width: 86px !important;
                display: flex !important;
                justify-content: flex-end !important;
                align-items: center !important;
                gap: 12px !important;
                overflow: visible !important;
            }

            .search-form,
            .favorite-icon {
                display: none !important;
            }

            .account-icon,
            .cart-open-btn {
                display: flex !important;
                width: 28px !important;
                min-width: 28px !important;
                height: 28px !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 20px !important;
                padding: 0 !important;
                margin: 0 !important;
                color: #000 !important;
            }
        }

        .cart-shipping-box {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e5e5e5;
        }

        .cart-shipping-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .cart-shipping-form {
            display: flex;
            gap: 8px;
        }

        .cart-shipping-form input {
            width: 100%;
            height: 44px;
            border: 1px solid #ddd;
            padding: 0 12px;
            font-size: 13px;
            outline: none;
        }

        .cart-shipping-form button {
            border: none;
            background: #111;
            color: #fff;
            height: 44px;
            padding: 0 16px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .cart-shipping-message {
            margin-top: 10px;
            font-size: 12px;
            color: #555;
        }

        .shipping-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 12px;
        }

        .shipping-option {
            width: 100%;
            border: 1px solid #ddd;
            background: #fff;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            transition: .2s ease;
        }

        .shipping-option:hover,
        .shipping-option.active {
            border-color: #111;
            background: #f8f8f8;
        }

        .shipping-option-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #111;
        }

        .shipping-option-bottom {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }

        .selected-shipping-box {
            margin-top: 12px;
            border: 1px solid #111;
            background: #f8f8f8;
            padding: 14px;
            display: none;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .selected-shipping-box div {
            display: flex;
            flex-direction: column;
        }

        .selected-shipping-box strong {
            font-size: 13px;
            color: #111;
        }

        .selected-shipping-box small {
            font-size: 11px;
            color: #666;
        }

        .selected-shipping-box span {
            font-size: 13px;
            font-weight: 700;
            color: #111;
        }

        .selected-shipping-box button {
            border: none;
            background: transparent;
            text-decoration: underline;
            font-size: 11px;
            cursor: pointer;
            color: #111;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="top-bar">
        FRETE GRÁTIS EM PEDIDOS ACIMA DE R$250
    </div>

    <nav class="main-navbar">

        <button class="mobile-menu-btn" id="mobileMenuBtn" type="button">
            <i class="bi bi-list"></i>
        </button>

        <div class="nav-left">
            <a href="/" class="nav-link-custom">INICIO</a>
            <a href="/#products" class="nav-link-custom">SHOP</a>
            <a href="/about/" class="nav-link-custom">COMUNIDADE</a>
        </div>

        <div class="nav-center">
            <a href="/" class="logo">
                <img style="width: 40%;" src="{% static 'img/logo-black.png' %}" alt="Risk Clube">
            </a>
        </div>

        <div class="nav-right">

            <a href="#" class="icon-link account-icon">
                <i class="bi bi-person"></i>
            </a>

            <a href="#" class="icon-link favorite-icon">
                <i class="bi bi-heart"></i>
            </a>

            <button type="button" class="icon-link cart-open-btn" id="openCartBtn">
                <i class="bi bi-bag"></i>
            </button>
        </div>

    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <button class="close-mobile-menu" id="closeMobileMenu" type="button">
            <i class="bi bi-x-lg"></i>
        </button>

        <a href="/" class="mobile-link">INICIO</a>
        <a href="/#products" class="mobile-link">SHOP</a>
        <a href="/about/" class="mobile-link">COMUNIDADE</a>
    </div>

    <div class="mobile-overlay" id="mobileOverlay"></div>

    {% block content %}{% endblock %}

    <div class="cart-overlay" id="cartOverlay"></div>

    <aside class="side-cart" id="sideCart">

        <div class="side-cart-header">
            <h3>Seu Carrinho</h3>
            <button type="button" id="closeCartBtn">× Fechar</button>
        </div>

        <div class="free-shipping-box">
            <p id="freeShippingText">
                Adicione mais R$ 250 para Frete Grátis
            </p>

            <div class="free-shipping-bar">
                <div class="free-shipping-progress" id="freeShippingProgress"></div>
            </div>
        </div>

        <div id="sideCartContent" class="side-cart-content">
            <div class="empty-cart-box">
                <i class="bi bi-cart-fill"></i>
                <p>Não há itens no carrinho</p>
            </div>
        </div>

        <div class="side-cart-footer" id="sideCartFooter"></div>

    </aside>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const openCartBtn = document.getElementById("openCartBtn");
        const closeCartBtn = document.getElementById("closeCartBtn");
        const sideCart = document.getElementById("sideCart");
        const cartOverlay = document.getElementById("cartOverlay");
        const sideCartContent = document.getElementById("sideCartContent");
        const sideCartFooter = document.getElementById("sideCartFooter");
        const freeShippingText = document.getElementById("freeShippingText");
        const freeShippingProgress = document.getElementById("freeShippingProgress");

        let selectedShippingId = null;

        function formatMoney(value) {
            return "R$ " + Number(value || 0).toFixed(2).replace(".", ",");
        }

        function openCart() {
            sideCart.classList.add("active");
            cartOverlay.classList.add("active");
            loadCart();
        }

        function closeCart() {
            sideCart.classList.remove("active");
            cartOverlay.classList.remove("active");
        }

        async function loadCart() {

            const response = await fetch("/cart/data/");
            const data = await response.json();

            freeShippingProgress.style.width = data.free_shipping_progress + "%";

            if (data.free_shipping_remaining > 0) {
                freeShippingText.innerText =
                    `Adicione mais ${formatMoney(data.free_shipping_remaining)} para Frete Grátis`;
            } else {
                freeShippingText.innerText = "Você ganhou Frete Grátis";
            }

            if (data.items.length === 0) {

                sideCartContent.innerHTML = `
                    <div class="empty-cart-box">
                        <i class="bi bi-cart-fill"></i>
                        <p>Não há itens no carrinho</p>
                    </div>
                `;

                sideCartFooter.innerHTML = "";

                return;
            }

            sideCartContent.innerHTML = data.items.map(item => `
                <div class="cart-item">

                    <img src="${item.image}" alt="${item.name}">

                    <div class="cart-item-info">

                        <div class="cart-item-name">
                            ${item.name}
                        </div>

                        <div class="cart-item-size">
                            Cor: ${item.color || "-"}
                        </div>

                        <div class="cart-item-size">
                            Tamanho: ${item.size || "-"}
                        </div>

                        <div class="cart-item-installments">
                            ${item.installments}
                        </div>

                    </div>

                    <div class="cart-item-price">
                        ${formatMoney(item.subtotal)}
                    </div>

                </div>
            `).join("");

            sideCartFooter.innerHTML = `

                <div class="cart-shipping-box">

                    <div class="cart-shipping-title">
                        Calcular frete
                    </div>

                    <div class="cart-shipping-form">
                        <input
                            type="text"
                            id="shippingCepInput"
                            placeholder="Digite seu CEP"
                            maxlength="9"
                        >

                        <button type="button" id="calculateShippingBtn">
                            Calcular
                        </button>
                    </div>

                    <div id="shippingMessage" class="cart-shipping-message"></div>

                    <div id="shippingOptions" class="shipping-options"></div>

                    <div id="selectedShippingBox" class="selected-shipping-box">

                        <div>
                            <strong id="selectedShippingName"></strong>
                            <small id="selectedShippingTime"></small>
                        </div>

                        <span id="selectedShippingPrice"></span>

                        <button type="button" id="changeShippingBtn">
                            Alterar
                        </button>

                    </div>

                </div>

                <div class="cart-total-line">
                    <span>Subtotal</span>
                    <strong id="cartSubtotal">${formatMoney(data.subtotal)}</strong>
                </div>

                <div class="cart-total-line">
                    <span>Frete</span>
                    <strong id="cartShipping">
                        ${data.shipping_price > 0 ? formatMoney(data.shipping_price) : "—"}
                    </strong>
                </div>

                <div class="cart-total-line">
                    <span>Total</span>
                    <strong id="cartTotal">${formatMoney(data.total)}</strong>
                </div>

                <a href="/cart/infinitepay/checkout/" class="checkout-btn">
                    FINALIZAR COMPRA
                </a>
            `;

            const calculateShippingBtn = document.getElementById("calculateShippingBtn");

            if (calculateShippingBtn) {
                calculateShippingBtn.addEventListener("click", calculateShipping);
            }

            const changeShippingBtn = document.getElementById("changeShippingBtn");

            if (changeShippingBtn) {
                changeShippingBtn.addEventListener("click", () => {

                    const optionsBox = document.getElementById("shippingOptions");
                    const selectedBox = document.getElementById("selectedShippingBox");

                    optionsBox.style.display = "flex";
                    selectedBox.style.display = "none";
                });
            }
        }

        async function calculateShipping() {

            const input = document.getElementById("shippingCepInput");
            const message = document.getElementById("shippingMessage");
            const optionsBox = document.getElementById("shippingOptions");

            const cep = input.value.replace(/\D/g, "");

            if (cep.length !== 8) {
                message.innerText = "Digite um CEP válido.";
                return;
            }

            message.innerText = "Calculando frete...";
            optionsBox.innerHTML = "";

            const response = await fetch("/cart/calculate-shipping/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    cep: cep
                })
            });

            const data = await response.json();

            if (!data.success) {
                message.innerText = data.error || "Erro ao calcular frete.";
                return;
            }

            message.innerText = "Escolha uma opção de entrega:";

            optionsBox.innerHTML = data.options.map(option => `

                <button
                    type="button"
                    class="shipping-option"
                    onclick='selectShipping(${JSON.stringify(option)})'
                >

                    <div class="shipping-option-top">

                        <span>
                            ${option.name || "Entrega"}
                            ${option.company ? "- " + option.company : ""}
                        </span>

                        <strong>
                            ${Number(option.price) > 0 ? formatMoney(option.price) : "Grátis"}
                        </strong>

                    </div>

                    <div class="shipping-option-bottom">
                        Entrega em ${option.delivery_time} dias úteis
                    </div>

                </button>

            `).join("");
        }

        async function selectShipping(option) {

            selectedShippingId = String(option.id);

            const response = await fetch("/cart/select-shipping/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify(option)
            });

            const data = await response.json();

            if (data.success) {

                const optionsBox = document.getElementById("shippingOptions");
                const selectedBox = document.getElementById("selectedShippingBox");

                const selectedName = document.getElementById("selectedShippingName");
                const selectedTime = document.getElementById("selectedShippingTime");
                const selectedPrice = document.getElementById("selectedShippingPrice");

                optionsBox.style.display = "none";
                selectedBox.style.display = "flex";

                selectedName.innerText =
                    `${option.name} ${option.company ? "- " + option.company : ""}`;

                selectedTime.innerText =
                    `Entrega em ${option.delivery_time} dias úteis`;

                selectedPrice.innerText =
                    Number(option.price) > 0
                    ? formatMoney(option.price)
                    : "Grátis";

                const subtotalText =
                    document.getElementById("cartSubtotal")
                    .innerText
                    .replace("R$", "")
                    .replace(".", "")
                    .replace(",", ".");

                const subtotal = Number(subtotalText);

                document.getElementById("cartShipping").innerText =
                    Number(option.price) > 0
                    ? formatMoney(option.price)
                    : "Grátis";

                document.getElementById("cartTotal").innerText =
                    formatMoney(subtotal + Number(option.price));
            }
        }

        if (openCartBtn) {
            openCartBtn.addEventListener("click", openCart);
        }

        if (closeCartBtn) {
            closeCartBtn.addEventListener("click", closeCart);
        }

        if (cartOverlay) {
            cartOverlay.addEventListener("click", closeCart);
        }
    </script>

</body>

</html>
