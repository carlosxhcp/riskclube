{% extends "pages/base.html" %}
{% load static %}

{% block title %}Mockup Individual | Risk Clube{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/vip_individual_mockup.css' %}">
{% endblock %}

{% block content %}

<section class="vip-mockup-page">

    <a href="javascript:history.back()" class="vip-back-link">
        <i class="bi bi-chevron-left"></i>
        Voltar
    </a>

    <div class="vip-mockup-layout">

        <!-- LADO ESQUERDO / PREVIEW -->
        <div class="vip-preview-area">

            <div class="vip-bottle-preview">

                <img 
                    src="{{ bottle_model.image.url }}" 
                    alt="{{ bottle_model.name }}" 
                    class="vip-bottle-image"
                >

                <div class="vip-custom-text" id="previewText">
                    SEU NOME AQUI
                </div>

            </div>

            <button type="button" class="vip-live-preview-btn">
                <i class="bi bi-eye"></i>
                Live Preview
            </button>

        </div>

        <!-- LADO DIREITO / CONFIGURAÇÕES -->
        <aside class="vip-config-panel">

            <div class="vip-panel-logo">
                Risk
            </div>

            <form method="POST" class="vip-config-form">
                {% csrf_token %}

                <!-- NOME -->
                <div class="vip-form-group">
                    <div class="vip-input-title">
                        <label for="customName">Seu nome aqui</label>
                        <i class="bi bi-pencil"></i>
                    </div>

                    <input 
                        type="text"
                        name="custom_name"
                        id="customName"
                        class="vip-name-input"
                        placeholder="Digite seu nome"
                        maxlength="18"
                    >
                </div>

                <!-- FONTES -->
                <div class="vip-form-group">

                    <div class="vip-section-title">
                        <h3>Fonte</h3>
                        <button type="button">Ver todas</button>
                    </div>

                    <div class="vip-font-options">

                        <label class="vip-font-card active">
                            <input type="radio" name="font" value="gotham" checked>
                            <span>Aa</span>
                            <small>Gotham</small>
                        </label>

                        <label class="vip-font-card">
                            <input type="radio" name="font" value="montserrat">
                            <span>Aa</span>
                            <small>Montserrat</small>
                        </label>

                        <label class="vip-font-card">
                            <input type="radio" name="font" value="helvetika">
                            <span>Aa</span>
                            <small>Helvetika</small>
                        </label>

                        <label class="vip-font-card">
                            <input type="radio" name="font" value="raleway">
                            <span>Aa</span>
                            <small>Raleway</small>
                        </label>

                    </div>

                </div>

                <!-- ORIENTAÇÃO -->
                <div class="vip-form-group">

                    <div class="vip-section-title">
                        <h3>Orientação</h3>
                    </div>

                    <div class="vip-orientation-options">

                        <label class="vip-orientation-card active">
                            <input type="radio" name="orientation" value="vertical" checked>
                            <i class="bi bi-arrows-vertical"></i>
                            <span>Vertical</span>
                        </label>

                        <label class="vip-orientation-card">
                            <input type="radio" name="orientation" value="horizontal">
                            <i class="bi bi-arrows"></i>
                            <span>Horizontal</span>
                        </label>

                    </div>

                </div>

                <!-- CATEGORIA -->
                <div class="vip-form-group">

                    <div class="vip-section-title">
                        <h3>Escolha sua categoria</h3>
                    </div>

                    <div class="vip-category-grid">

                        <label class="vip-category-card active">
                            <input type="radio" name="category" value="animais" checked>
                            <i class="bi bi-shield-fill"></i>
                            <span>Animais</span>
                        </label>

                        <label class="vip-category-card">
                            <input type="radio" name="category" value="mistico">
                            <i class="bi bi-eye"></i>
                            <span>Místico</span>
                        </label>

                        <label class="vip-category-card">
                            <input type="radio" name="category" value="religiao">
                            <i class="bi bi-cross"></i>
                            <span>Religião</span>
                        </label>

                        <label class="vip-category-card">
                            <input type="radio" name="category" value="time">
                            <i class="bi bi-tshirt"></i>
                            <span>Time</span>
                        </label>

                    </div>

                </div>

                <!-- PREÇO -->
                <div class="vip-price-box">
                    R$ {{ product.price }}
                </div>

                <button type="submit" class="vip-continue-button">
                    Continuar
                    <i class="bi bi-arrow-right"></i>
                </button>

            </form>

        </aside>

    </div>

</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const input = document.getElementById("customName");
    const previewText = document.getElementById("previewText");

    const fontCards = document.querySelectorAll(".vip-font-card");
    const orientationCards = document.querySelectorAll(".vip-orientation-card");
    const categoryCards = document.querySelectorAll(".vip-category-card");

    input.addEventListener("input", function () {
        previewText.textContent = this.value.trim() || "SEU NOME AQUI";
    });

    fontCards.forEach(card => {
        card.addEventListener("click", function () {
            fontCards.forEach(item => item.classList.remove("active"));
            this.classList.add("active");

            const font = this.querySelector("input").value;
            previewText.dataset.font = font;
        });
    });

    orientationCards.forEach(card => {
        card.addEventListener("click", function () {
            orientationCards.forEach(item => item.classList.remove("active"));
            this.classList.add("active");

            const orientation = this.querySelector("input").value;

            if (orientation === "horizontal") {
                previewText.classList.add("horizontal");
            } else {
                previewText.classList.remove("horizontal");
            }
        });
    });

    categoryCards.forEach(card => {
        card.addEventListener("click", function () {
            categoryCards.forEach(item => item.classList.remove("active"));
            this.classList.add("active");
        });
    });
});
</script>

{% endblock %}
